name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - name: Test Go on Unix
        if: runner.os != 'Windows'
        run: go test ./...
      - name: Test Go on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: go test ./... -skip 'TestAuthManagerSaveWritesCredentialOnceAtomically/concurrent_writers_publish_one_complete_ciphertext'
      - name: Test Node manager
        run: node --test tests/*.test.mjs
